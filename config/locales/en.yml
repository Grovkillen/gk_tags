  text_gk_tags_share: "You choose who sees your focus. Default: your current focus is seen by your manager, your earlier focus by nobody. Those you share with see only the issues they may see themselves."
  label_gk_tags_share_current: "Current focus shared with"
  label_gk_tags_share_history: "Earlier focus shared with"
  label_gk_tags_share_manager: "My manager"
  label_gk_tags_share_groups: "Groups"
