  text_gk_tags_focus_mine: "The issues you are actively working on right now, at most %{max}. They are not ranked: the order comes from priority and due date. An issue that waits (a waiting status or assigned to someone else) is marked."
  text_gk_tags_focus_history: "Issues you have had in focus, with when they came in and when they went out (empty while they remain). Show the last issues or the last days."
  text_gk_tags_focus_group: "What others have shared with you: their current focus, and their earlier focus where that is shared too. An issue you may not see is not named."
