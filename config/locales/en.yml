  field_gk_tags_focus_history_days: "Earlier focus, number of days"
  field_gk_tags_manager_responsibility: "The manager's responsibility"
  text_gk_tags_manager_responsibility: "The responsibility in people that makes someone a person's manager for focus: whoever holds it in one of the person's groups of people (else in the whole organization), and whoever stands in when the holder is away. Empty: no manager."
