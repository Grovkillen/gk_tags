  text_gk_tags_types_intro: "A type says what a tag is and which rules it follows. A tag that is untyped follows the settings of the type Free. A type is never removed; a retired type is not given to new tags, and its tags stay."
  text_gk_tags_type_key: "Lowercase letters, digits and underscores, a letter first. The key never changes."
  text_gk_tags_type_category: "The tags of the type are shown in the category's colour, and the type gets the category's edge in the sidebar. The categories are the same in the whole instance."
  text_gk_tags_namespace: "Written before a colon: with the namespace ce, #CE:S16 means the value S16 of this type. Empty: the type is not written that way."
  text_gk_tags_exclusive: "An object may have at most one tag of the type."
  text_gk_tags_allowed_on: "Nothing chosen: tags of the type may be put on anything that can be tagged."
  text_gk_tags_required_for: "An object of the chosen kinds is not saved with tags lacking a tag of the type. Holds where the tags are written: the tag field on the issue and in the forms of the other objects, and REST with the tag field."
  text_gk_tags_inherit_parents: "A search or a filter on a tag also finds objects tagged with its children of the type."
  text_gk_tags_repeat_keys: "Tags of the type may have the same handle under different parents and are then written with their path, for example #county/place."
  text_gk_tags_type_retire: "A retired type is not given to new tags and no longer requires anything, but its tags keep the type."
  text_gk_tags_type_is_retired: "The type is retired."
  text_gk_tags_set_type: "The type decides the tag's category, icon and rules."
  text_gk_tags_type_position: "Lowest first: in the list of types, in the choice of type for a tag and in the Tags box in the sidebar."
  text_gk_tags_move: "Choose the parent, or remove it for no parent. A new parent is made without a type when you save. A tag can never end up under itself."
  text_gk_tags_with_children: "With issues tagged with the tag's children, where the type says so."
  error_gk_tags_no_namespace: "No type has the namespace in %{handle}."
  error_gk_tags_new_parent_namespace: "A new parent is made without a type and cannot be written with a namespace: %{handle}. Create the tag first, or write the parent without the namespace."
  error_gk_tags_ambiguous: "There are several tags #%{handle} under different parents. Write the path, for example #parent/%{handle}."
  error_gk_tags_type_retired: "The type %{type} is retired and gets no new tags."
  error_gk_tags_not_allowed: "The tag #%{handle} is of the type %{type}, which may not be put on %{thing}."
  error_gk_tags_exclusive: "At most one tag of the type %{type} per object: %{handles}."
  error_gk_tags_required: "%{thing} needs a tag of the type %{type}."
  error_gk_tags_may_not_tag: "You may not change the tags here."
  error_gk_tags_cycle: "A tag cannot be under itself or under one of its children."
