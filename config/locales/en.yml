  text_gk_tags_admin_intro: "Free tags are made by whoever writes a new handle and become established as more people use them. An administrator makes a tag managed with a name, a description and a colour, gives it a new handle (the old one becomes an alias), adds aliases, merges and retires. Nothing is deleted."
