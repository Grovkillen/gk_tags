  text_gk_tags_types_intro: "En typ säger vad en tagg är och vilka regler den följer. En tagg som är utan typ följer inställningarna i typen Fri. En typ tas aldrig bort; en avvecklad typ ges inte till nya taggar, och dess taggar står kvar."
